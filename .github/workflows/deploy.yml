name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write # to enable use of OIDC for npm provenance
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm stage publish
